<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#26262b"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0e0e10"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <text x="80" y="150" font-size="64" font-weight="700" fill="#f4f4f5" letter-spacing="-1">Abundance in Resources</text>
  <text x="80" y="232" font-size="64" font-weight="700" fill="#fcd34d" letter-spacing="-1">and the Keenness to Optimize</text>

  <!-- abundance -->
  <rect x="80" y="320" width="500" height="240" rx="18" fill="#17171b" stroke="#2e2e34" stroke-width="1.5"/>
  <text x="108" y="362" font-size="22" font-weight="600" fill="#f4f4f5">Where engineers are expensive</text>
  <g font-size="19" fill="#a1a1aa">
    <text x="108" y="418">Engineer time</text>
    <text x="108" y="466">Server cost</text>
  </g>
  <rect x="270" y="400" width="280" height="24" rx="6" fill="#fcd34d" fill-opacity="0.85"/>
  <rect x="270" y="448" width="56" height="24" rx="6" fill="#93c5fd" fill-opacity="0.85"/>
  <text x="108" y="526" font-size="22" font-weight="600" fill="#93c5fd">→ Add hardware</text>

  <!-- scarcity -->
  <rect x="620" y="320" width="500" height="240" rx="18" fill="#17171b" stroke="#2e2e34" stroke-width="1.5"/>
  <text x="648" y="362" font-size="22" font-weight="600" fill="#f4f4f5">Where engineers are cheap</text>
  <g font-size="19" fill="#a1a1aa">
    <text x="648" y="418">Engineer time</text>
    <text x="648" y="466">Server cost</text>
  </g>
  <rect x="810" y="400" width="56" height="24" rx="6" fill="#fcd34d" fill-opacity="0.85"/>
  <rect x="810" y="448" width="280" height="24" rx="6" fill="#93c5fd" fill-opacity="0.85"/>
  <text x="648" y="526" font-size="22" font-weight="600" fill="#fcd34d">→ Optimize</text>
</svg>
