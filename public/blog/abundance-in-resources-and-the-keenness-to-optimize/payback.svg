<svg viewBox="0 0 728 372" width="728" height="372" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#26262b"/>
    </pattern>
  </defs>
  <rect width="728" height="372" rx="14" fill="#0e0e10"/>
  <rect width="728" height="372" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="727" height="371" rx="14" fill="none" stroke="#202024"/>

  <text x="24" y="42" font-size="16" font-weight="600" fill="#f4f4f5">Two days of work to halve a $500/month bill</text>
  <text x="24" y="64" font-size="13.5" fill="#8b8b94">Same work, same $250/month saved. Round, made-up numbers.</text>

  <!-- expensive engineer -->
  <rect x="16" y="84" width="696" height="100" rx="12" fill="#fcd34d" fill-opacity="0.06" stroke="#fcd34d" stroke-opacity="0.35"/>
  <text x="32" y="118" font-size="15" font-weight="600" fill="#fde68a">$100 / engineer-hour</text>
  <text x="32" y="142" font-size="13.5" fill="#8b8b94">2 days of work = $1,600</text>
  <rect x="240" y="104" width="402" height="22" rx="5" fill="#fcd34d" fill-opacity="0.85"/>
  <text x="240" y="160" font-size="13.5" fill="#d4d4d8">Pays back in ~6.5 months</text>

  <!-- cheap engineer -->
  <rect x="16" y="196" width="696" height="100" rx="12" fill="#4ade80" fill-opacity="0.06" stroke="#4ade80" stroke-opacity="0.35"/>
  <text x="32" y="230" font-size="15" font-weight="600" fill="#86efac">$10 / engineer-hour</text>
  <text x="32" y="254" font-size="13.5" fill="#8b8b94">2 days of work = $160</text>
  <rect x="240" y="216" width="40" height="22" rx="5" fill="#4ade80" fill-opacity="0.85"/>
  <text x="240" y="272" font-size="13.5" fill="#d4d4d8">Pays back in under 3 weeks</text>

  <!-- axis: 0..7 months over x 240..680 -->
  <line x1="240" y1="316" x2="680" y2="316" stroke="#3f3f46" stroke-width="1.5"/>
  <g stroke="#3f3f46" stroke-width="1.5">
    <line x1="240" y1="312" x2="240" y2="320"/>
    <line x1="302.9" y1="312" x2="302.9" y2="320"/>
    <line x1="365.7" y1="312" x2="365.7" y2="320"/>
    <line x1="428.6" y1="312" x2="428.6" y2="320"/>
    <line x1="491.4" y1="312" x2="491.4" y2="320"/>
    <line x1="554.3" y1="312" x2="554.3" y2="320"/>
    <line x1="617.1" y1="312" x2="617.1" y2="320"/>
    <line x1="680" y1="312" x2="680" y2="320"/>
  </g>
  <g font-size="12.5" fill="#8b8b94" text-anchor="middle">
    <text x="240" y="338">0</text>
    <text x="302.9" y="338">1</text>
    <text x="365.7" y="338">2</text>
    <text x="428.6" y="338">3</text>
    <text x="491.4" y="338">4</text>
    <text x="554.3" y="338">5</text>
    <text x="617.1" y="338">6</text>
    <text x="680" y="338">7</text>
  </g>
  <text x="680" y="358" font-size="12.5" fill="#8b8b94" text-anchor="end">months to pay back</text>
</svg>
