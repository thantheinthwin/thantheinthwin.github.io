<svg viewBox="0 0 1000 620" width="1000" height="620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#242424"/>

  <!-- client -->
  <rect x="400" y="30" width="200" height="70" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="500" y="73" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">Client</text>
  <line x1="500" y1="100" x2="500" y2="156" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- nginx -->
  <rect x="350" y="160" width="300" height="80" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="500" y="195" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">nginx</text>
  <text x="500" y="222" font-size="16" fill="#9a9a9a" text-anchor="middle">TLS · path routing</text>

  <line x1="430" y1="240" x2="256" y2="316" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="268" font-size="18" fill="#c084fc" text-anchor="end">/auth/*</text>
  <line x1="570" y1="240" x2="744" y2="316" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="682" y="268" font-size="18" fill="#4ade80">/v1/*</text>

  <!-- auth server -->
  <rect x="80" y="320" width="340" height="100" rx="10" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <text x="250" y="362" font-size="22" fill="#c084fc" text-anchor="middle" font-weight="700">Auth Server</text>
  <text x="250" y="392" font-size="16" fill="#9a9a9a" text-anchor="middle">Better Auth · TypeScript</text>

  <!-- go api -->
  <rect x="580" y="320" width="340" height="100" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <text x="750" y="362" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">Go API</text>
  <text x="750" y="392" font-size="16" fill="#9a9a9a" text-anchor="middle">domain logic</text>

  <!-- JWKS -->
  <line x1="578" y1="370" x2="424" y2="370" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="500" y="358" font-size="16" fill="#9a9a9a" text-anchor="middle">JWKS</text>

  <!-- database -->
  <line x1="250" y1="420" x2="396" y2="497" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="478" font-size="15" fill="#9a9a9a" text-anchor="end">owns auth tables</text>
  <line x1="750" y1="420" x2="604" y2="497" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="478" font-size="15" fill="#9a9a9a">reads user_id only</text>

  <rect x="300" y="500" width="400" height="80" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="500" y="536" font-size="22" fill="#22d3ee" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="500" y="563" font-size="16" fill="#9a9a9a" text-anchor="middle">shared instance</text>
</svg>
