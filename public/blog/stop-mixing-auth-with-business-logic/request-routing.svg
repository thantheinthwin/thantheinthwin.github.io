<svg viewBox="0 0 1000 380" width="1000" height="380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="999" height="379" fill="none" stroke="#242424"/>

  <!-- client -->
  <rect x="30" y="145" width="180" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="120" y="197" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">Client</text>

  <line x1="210" y1="190" x2="326" y2="190" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="268" y="176" font-size="15" fill="#9a9a9a" text-anchor="middle">one API</text>

  <!-- nginx -->
  <rect x="330" y="135" width="200" height="110" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="430" y="185" font-size="22" fill="#e8e8e8" text-anchor="middle" font-weight="700">nginx</text>
  <text x="430" y="215" font-size="15" fill="#9a9a9a" text-anchor="middle">reverse proxy</text>

  <!-- branches -->
  <line x1="530" y1="168" x2="696" y2="82" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="108" font-size="18" fill="#c084fc" text-anchor="middle">/auth/*</text>
  <line x1="530" y1="212" x2="696" y2="298" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="292" font-size="18" fill="#4ade80" text-anchor="middle">/v1/*</text>

  <!-- auth -->
  <rect x="700" y="30" width="270" height="100" rx="10" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <text x="835" y="72" font-size="22" fill="#c084fc" text-anchor="middle" font-weight="700">Auth Server</text>
  <text x="835" y="102" font-size="15" fill="#9a9a9a" text-anchor="middle">sign-in · sessions · OAuth</text>

  <!-- go api -->
  <rect x="700" y="250" width="270" height="100" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <text x="835" y="292" font-size="22" fill="#4ade80" text-anchor="middle" font-weight="700">Go API</text>
  <text x="835" y="322" font-size="15" fill="#9a9a9a" text-anchor="middle">domain endpoints</text>
</svg>
