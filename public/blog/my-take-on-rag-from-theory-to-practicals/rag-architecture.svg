<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="999" height="399" fill="none" stroke="#242424"/>

  <!-- indexing lane -->
  <text x="20" y="42" font-size="18" fill="#8a8a8a">Indexing</text>
  <g text-anchor="middle">
    <rect x="20" y="60" width="210" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="125" y="100" font-size="20" fill="#e8e8e8" font-weight="700">Documents</text>
    <text x="125" y="127" font-size="14" fill="#9a9a9a">PDFs · wikis · DBs</text>

    <rect x="270" y="60" width="210" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="375" y="100" font-size="20" fill="#e8e8e8" font-weight="700">Chunk</text>
    <text x="375" y="127" font-size="14" fill="#9a9a9a">300–500 tokens</text>

    <rect x="520" y="60" width="210" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="625" y="100" font-size="20" fill="#e8e8e8" font-weight="700">Embed</text>
    <text x="625" y="127" font-size="14" fill="#9a9a9a">vectors + metadata</text>

    <rect x="770" y="60" width="210" height="90" rx="10" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <text x="875" y="100" font-size="20" fill="#818cf8" font-weight="700">Vector DB</text>
    <text x="875" y="127" font-size="14" fill="#9a9a9a">pgvector · FAISS</text>
  </g>
  <line x1="230" y1="105" x2="266" y2="105" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="516" y2="105" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="105" x2="766" y2="105" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- vector db feeds retriever -->
  <polyline points="875,150 875,205 302,205 302,266" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="590" y="196" font-size="14" fill="#818cf8" text-anchor="middle">similarity search</text>

  <!-- query lane -->
  <text x="20" y="252" font-size="18" fill="#8a8a8a">Query</text>
  <g text-anchor="middle">
    <rect x="20" y="270" width="168" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="104" y="310" font-size="20" fill="#e8e8e8" font-weight="700">Query</text>
    <text x="104" y="337" font-size="14" fill="#9a9a9a">user question</text>

    <rect x="218" y="270" width="168" height="90" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="302" y="310" font-size="20" fill="#4ade80" font-weight="700">Retriever</text>
    <text x="302" y="337" font-size="14" fill="#9a9a9a">top-k chunks</text>

    <rect x="416" y="270" width="168" height="90" rx="10" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
    <text x="500" y="310" font-size="20" fill="#d6a35c" font-weight="700">Reranker</text>
    <text x="500" y="337" font-size="14" fill="#9a9a9a">true relevance</text>

    <rect x="614" y="270" width="168" height="90" rx="10" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <text x="698" y="310" font-size="20" fill="#f87171" font-weight="700">LLM</text>
    <text x="698" y="337" font-size="14" fill="#9a9a9a">generator</text>

    <rect x="812" y="270" width="168" height="90" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="896" y="310" font-size="20" fill="#e8e8e8" font-weight="700">Answer</text>
    <text x="896" y="337" font-size="14" fill="#9a9a9a">grounded</text>
  </g>
  <line x1="188" y1="315" x2="214" y2="315" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="386" y1="315" x2="412" y2="315" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="584" y1="315" x2="610" y2="315" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="315" x2="808" y2="315" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
