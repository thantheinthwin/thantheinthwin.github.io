<svg viewBox="0 0 728 344" width="728" height="344" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#26262b"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63636b"/></marker>
  </defs>
  <rect width="728" height="344" rx="14" fill="#0e0e10"/>
  <rect width="728" height="344" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="727" height="343" rx="14" fill="none" stroke="#202024"/>
  <text x="24" y="36" font-size="13" font-weight="600" fill="#a5b4fc">Lead agent</text>
  <text x="305" y="36" font-size="13" font-weight="600" fill="#f2c27b">Every agent it starts</text>
  <line x1="25" y1="44" x2="283" y2="44" stroke="#818cf8" stroke-opacity="0.5"/>
  <line x1="305" y1="44" x2="703" y2="44" stroke="#e0a85a" stroke-opacity="0.5"/>
  <rect x="25" y="58" width="118" height="206" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <text x="37" y="84" font-size="14" font-weight="600" fill="#f4f4f5">Context</text>
  <text x="37" y="110" font-size="11.5" font-weight="600" fill="#fda4af">was</text>
  <text x="37" y="128" font-size="12.5" fill="#d4d4d8">every report,</text>
  <text x="37" y="145" font-size="12.5" fill="#d4d4d8">diff and log</text>
  <text x="37" y="162" font-size="12.5" fill="#d4d4d8">piled up</text>
  <text x="37" y="190" font-size="11.5" font-weight="600" fill="#86efac">now</text>
  <text x="37" y="208" font-size="12.5" fill="#d4d4d8">15-line reports,</text>
  <text x="37" y="225" font-size="12.5" fill="#d4d4d8">no dumps</text>
  <text x="154" y="168" font-size="20" font-weight="600" fill="#a1a1aa" text-anchor="middle">×</text>
  <rect x="165" y="58" width="118" height="206" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <text x="177" y="84" font-size="14" font-weight="600" fill="#f4f4f5">Turns</text>
  <text x="177" y="110" font-size="11.5" font-weight="600" fill="#fda4af">was</text>
  <text x="177" y="128" font-size="12.5" fill="#d4d4d8">a one-line fix</text>
  <text x="177" y="145" font-size="12.5" fill="#d4d4d8">ran the full</text>
  <text x="177" y="162" font-size="12.5" fill="#d4d4d8">pipeline</text>
  <text x="177" y="190" font-size="11.5" font-weight="600" fill="#86efac">now</text>
  <text x="177" y="208" font-size="12.5" fill="#d4d4d8">size first: S, M</text>
  <text x="177" y="225" font-size="12.5" fill="#d4d4d8">or L</text>
  <text x="294" y="168" font-size="20" font-weight="600" fill="#a1a1aa" text-anchor="middle">+</text>
  <rect x="305" y="58" width="118" height="206" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <text x="317" y="84" font-size="14" font-weight="600" fill="#f4f4f5">Agents</text>
  <text x="317" y="110" font-size="11.5" font-weight="600" fill="#fda4af">was</text>
  <text x="317" y="128" font-size="12.5" fill="#d4d4d8">each re-traced</text>
  <text x="317" y="145" font-size="12.5" fill="#d4d4d8">the code, on the</text>
  <text x="317" y="162" font-size="12.5" fill="#d4d4d8">biggest model</text>
  <text x="317" y="190" font-size="11.5" font-weight="600" fill="#86efac">now</text>
  <text x="317" y="208" font-size="12.5" fill="#d4d4d8">context map,</text>
  <text x="317" y="225" font-size="12.5" fill="#d4d4d8">lowest tier that</text>
  <text x="317" y="242" font-size="12.5" fill="#d4d4d8">fits</text>
  <text x="434" y="168" font-size="20" font-weight="600" fill="#a1a1aa" text-anchor="middle">×</text>
  <rect x="445" y="58" width="118" height="206" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <text x="457" y="84" font-size="14" font-weight="600" fill="#f4f4f5">Review rounds</text>
  <text x="457" y="110" font-size="11.5" font-weight="600" fill="#fda4af">was</text>
  <text x="457" y="128" font-size="12.5" fill="#d4d4d8">no limit</text>
  <text x="457" y="190" font-size="11.5" font-weight="600" fill="#86efac">now</text>
  <text x="457" y="208" font-size="12.5" fill="#d4d4d8">at most two</text>
  <text x="574" y="168" font-size="20" font-weight="600" fill="#a1a1aa" text-anchor="middle">×</text>
  <rect x="585" y="58" width="118" height="206" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <text x="597" y="84" font-size="14" font-weight="600" fill="#f4f4f5">Gates checked</text>
  <text x="597" y="110" font-size="11.5" font-weight="600" fill="#fda4af">was</text>
  <text x="597" y="128" font-size="12.5" fill="#d4d4d8">all four, every</text>
  <text x="597" y="145" font-size="12.5" fill="#d4d4d8">round</text>
  <text x="597" y="190" font-size="11.5" font-weight="600" fill="#86efac">now</text>
  <text x="597" y="208" font-size="12.5" fill="#d4d4d8">only the ones</text>
  <text x="597" y="225" font-size="12.5" fill="#d4d4d8">that failed</text>
  <rect x="16" y="280" width="696" height="48" rx="10" fill="#e0a85a" fill-opacity="0.07" stroke="#e0a85a" stroke-opacity="0.4"/>
  <text x="32" y="309" font-size="14" font-weight="600" fill="#f2c27b">× effort, on all of it</text>
  <text x="206" y="309" font-size="12.5" fill="#d4d4d8">was: sessions at high, xhigh or max</text>
  <text x="470" y="309" font-size="12.5" fill="#d4d4d8">now: medium lead, high at most</text>
</svg>
