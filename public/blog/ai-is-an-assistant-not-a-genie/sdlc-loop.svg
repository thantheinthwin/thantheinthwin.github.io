<svg viewBox="0 0 720 620" width="720" height="620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="720" height="620" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="719" height="619" fill="none" stroke="#242424"/>

  <!-- loop back from 8 to 1 -->
  <polyline points="540,60 540,32 180,32 180,56" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-loop)"/>
  <text x="360" y="24" font-size="16" fill="#22d3ee" text-anchor="middle">repeat with what you learned</text>

  <g fill="none" stroke="#6b6b6b" stroke-width="2">
    <rect x="20" y="60" width="320" height="115" rx="10"/>
    <rect x="20" y="200" width="320" height="115" rx="10"/>
    <rect x="20" y="340" width="320" height="115" rx="10"/>
    <rect x="20" y="480" width="320" height="115" rx="10"/>
    <rect x="380" y="480" width="320" height="115" rx="10"/>
    <rect x="380" y="340" width="320" height="115" rx="10"/>
    <rect x="380" y="200" width="320" height="115" rx="10"/>
    <rect x="380" y="60" width="320" height="115" rx="10"/>
  </g>

  <g font-size="22" font-weight="700" fill="#e8e8e8">
    <text x="38" y="96">1 · Research</text>
    <text x="38" y="236">2 · Scoping</text>
    <text x="38" y="376">3 · Design</text>
    <text x="38" y="516">4 · Development</text>
    <text x="398" y="516">5 · Testing</text>
    <text x="398" y="376">6 · Review</text>
    <text x="398" y="236">7 · Shipping</text>
    <text x="398" y="96">8 · Operating</text>
  </g>

  <g font-size="18" fill="#9a9a9a">
    <text y="130"><tspan x="38" font-weight="700">AI</tspan><tspan x="86">reads the docs</tspan></text>
    <text y="270"><tspan x="38" font-weight="700">AI</tspan><tspan x="86">drafts the spec</tspan></text>
    <text y="410"><tspan x="38" font-weight="700">AI</tspan><tspan x="86">lists options</tspan></text>
    <text y="550"><tspan x="38" font-weight="700">AI</tspan><tspan x="86">writes the code</tspan></text>
    <text y="550"><tspan x="398" font-weight="700">AI</tspan><tspan x="446">writes tests</tspan></text>
    <text y="410"><tspan x="398" font-weight="700">AI</tspan><tspan x="446">first pass</tspan></text>
    <text y="270"><tspan x="398" font-weight="700">AI</tspan><tspan x="446">watches rollout</tspan></text>
    <text y="130"><tspan x="398" font-weight="700">AI</tspan><tspan x="446">triages alerts</tspan></text>
  </g>

  <g font-size="18" fill="#22d3ee">
    <text y="158"><tspan x="38" font-weight="700">You</tspan><tspan x="86">pick the problem</tspan></text>
    <text y="298"><tspan x="38" font-weight="700">You</tspan><tspan x="86">set the scope</tspan></text>
    <text y="438"><tspan x="38" font-weight="700">You</tspan><tspan x="86">pick trade-offs</tspan></text>
    <text y="578"><tspan x="38" font-weight="700">You</tspan><tspan x="86">direct it</tspan></text>
    <text y="578"><tspan x="398" font-weight="700">You</tspan><tspan x="446">set what passes</tspan></text>
    <text y="438"><tspan x="398" font-weight="700">You</tspan><tspan x="446">approve</tspan></text>
    <text y="298"><tspan x="398" font-weight="700">You</tspan><tspan x="446">go or roll back</tspan></text>
    <text y="158"><tspan x="398" font-weight="700">You</tspan><tspan x="446">own the fix</tspan></text>
  </g>

  <g stroke="#8a8a8a" stroke-width="2.5">
    <line x1="180" y1="175" x2="180" y2="196" marker-end="url(#arrow)"/>
    <line x1="180" y1="315" x2="180" y2="336" marker-end="url(#arrow)"/>
    <line x1="180" y1="455" x2="180" y2="476" marker-end="url(#arrow)"/>
    <line x1="340" y1="537" x2="376" y2="537" marker-end="url(#arrow)"/>
    <line x1="540" y1="480" x2="540" y2="459" marker-end="url(#arrow)"/>
    <line x1="540" y1="340" x2="540" y2="319" marker-end="url(#arrow)"/>
    <line x1="540" y1="200" x2="540" y2="179" marker-end="url(#arrow)"/>
  </g>
</svg>
