  <!-- stage names -->
  <g font-size="18" font-weight="600" fill="#f0f0f0">
    <text x="136" y="98">Research</text>
    <text x="136" y="144">Scoping</text>
    <text x="136" y="190">Design</text>
    <text x="136" y="254">Development</text>
    <text x="136" y="300">Testing</text>
    <text x="136" y="346">Review</text>
    <text x="136" y="410">Shipping</text>
    <text x="136" y="456">Operating</text>
  </g>

  <!-- AI does -->
  <g font-size="17" fill="#a3a3a3">
    <text x="340" y="98">reads the docs</text>
    <text x="340" y="144">drafts the spec</text>
    <text x="340" y="190">lists the options</text>
    <text x="340" y="254">writes the code</text>
    <text x="340" y="300">writes the tests</text>
    <text x="340" y="346">does a first pass</text>
    <text x="340" y="410">watches the rollout</text>
    <text x="340" y="456">triages the alert</text>
  </g>

  <!-- You decide -->
  <g font-size="17" fill="#22d3ee">
    <text x="548" y="98">pick the problem</text>
    <text x="548" y="144">set the scope</text>
    <text x="548" y="190">pick the trade-off</text>
    <text x="548" y="254">direct it</text>
    <text x="548" y="300">decide what passes</text>
    <text x="548" y="346">approve or reject</text>
    <text x="548" y="410">go or roll back</text>
    <text x="548" y="456">own the fix</text>
  </g>

  <!-- loop -->
  <use href="#i-loop" x="104" y="504" width="20" height="20" color="#8a8a8a"/>
  <text x="136" y="520" font-size="16" fill="#8a8a8a">Then back to Research, with what you learned.</text>
</svg>
