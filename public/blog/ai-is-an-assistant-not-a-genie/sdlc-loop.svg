  <!-- AI lines -->
  <g font-size="15" fill="#c4c4c4">
    <text y="140"><tspan x="48" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="84">reads the docs</tspan></text>
    <text y="140"><tspan x="286" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="322">drafts the spec</tspan></text>
    <text y="140"><tspan x="524" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="560">lists the options</tspan></text>
    <text y="356"><tspan x="48" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="84">writes the code</tspan></text>
    <text y="356"><tspan x="286" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="322">writes the tests</tspan></text>
    <text y="356"><tspan x="524" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="560">does a first pass</tspan></text>
    <text y="572"><tspan x="48" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="84">watches the rollout</tspan></text>
    <text y="572"><tspan x="286" font-size="14" font-weight="700" fill="#8f8f8f">AI</tspan><tspan x="322">triages the alert</tspan></text>
  </g>

  <!-- You lines -->
  <g font-size="15" fill="#22d3ee">
    <text y="168"><tspan x="48" font-size="14" font-weight="700">You</tspan><tspan x="84">pick the problem</tspan></text>
    <text y="168"><tspan x="286" font-size="14" font-weight="700">You</tspan><tspan x="322">set the scope</tspan></text>
    <text y="168"><tspan x="524" font-size="14" font-weight="700">You</tspan><tspan x="560">pick the trade-off</tspan></text>
    <text y="384"><tspan x="48" font-size="14" font-weight="700">You</tspan><tspan x="84">direct it</tspan></text>
    <text y="384"><tspan x="286" font-size="14" font-weight="700">You</tspan><tspan x="322">decide what passes</tspan></text>
    <text y="384"><tspan x="524" font-size="14" font-weight="700">You</tspan><tspan x="560">approve or reject</tspan></text>
    <text y="600"><tspan x="48" font-size="14" font-weight="700">You</tspan><tspan x="84">go or roll back</tspan></text>
    <text y="600"><tspan x="286" font-size="14" font-weight="700">You</tspan><tspan x="322">own the fix</tspan></text>
  </g>

