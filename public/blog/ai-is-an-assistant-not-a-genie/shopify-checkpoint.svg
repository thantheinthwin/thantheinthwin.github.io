<svg viewBox="16 0 728 604" width="728" height="604" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Icons: Phosphor Icons (https://phosphoricons.com), MIT License, Copyright (c) 2023 Phosphor Icons -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c5c"/>
    </marker>
    <symbol id="i-test" viewBox="0 0 256 256"><g fill="currentColor"><path d="M221.69,199.77,160,96.92V40h8a8,8,0,0,0,0-16H88a8,8,0,0,0,0,16h8V96.92L34.31,199.77A16,16,0,0,0,48,224H208a16,16,0,0,0,13.72-24.23ZM110.86,103.25A7.93,7.93,0,0,0,112,99.14V40h32V99.14a7.93,7.93,0,0,0,1.14,4.11L183.36,167c-12,2.37-29.07,1.37-51.75-10.11-15.91-8.05-31.05-12.32-45.22-12.81ZM48,208l28.54-47.58c14.25-1.74,30.31,1.85,47.82,10.72,19,9.61,35,12.88,48,12.88a69.89,69.89,0,0,0,19.55-2.7L208,208Z"/></g></symbol>
    <symbol id="i-compare" viewBox="0 0 256 256"><g fill="currentColor"><path d="M104,32H64A16,16,0,0,0,48,48V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,104,32Zm0,176H64V48h40ZM192,32H152a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,192,32Zm0,176H152V48h40Z"/></g></symbol>
    <symbol id="i-robot" viewBox="0 0 256 256"><g fill="currentColor"><path d="M200,48H136V16a8,8,0,0,0-16,0V48H56A32,32,0,0,0,24,80V192a32,32,0,0,0,32,32H200a32,32,0,0,0,32-32V80A32,32,0,0,0,200,48Zm16,144a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V80A16,16,0,0,1,56,64H200a16,16,0,0,1,16,16Zm-52-56H92a28,28,0,0,0,0,56h72a28,28,0,0,0,0-56Zm-24,16v24H116V152ZM80,164a12,12,0,0,1,12-12h8v24H92A12,12,0,0,1,80,164Zm84,12h-8V152h8a12,12,0,0,1,0,24ZM72,108a12,12,0,1,1,12,12A12,12,0,0,1,72,108Zm88,0a12,12,0,1,1,12,12A12,12,0,0,1,160,108Z"/></g></symbol>
  </defs>

  <!-- rail -->
  <line x1="48" y1="40" x2="48" y2="380" stroke="#2e2e2e" stroke-width="2"/>
  <!-- repeat loop: from step 4 back to step 2 -->
  <polyline points="40,380 22,380 22,156 36,156" fill="none" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dots -->
  <g fill="#0a0a0a" stroke="#8a8a8a" stroke-width="2">
    <circle cx="48" cy="40" r="6"/>
    <circle cx="48" cy="156" r="6"/>
    <circle cx="48" cy="236" r="6"/>
  </g>
  <circle cx="48" cy="380" r="6" fill="#0a0a0a" stroke="#22d3ee" stroke-width="2"/>

  <!-- 1 -->
  <text x="76" y="46" font-size="19" font-weight="600" fill="#f0f0f0">Plan the checkpoints</text>
  <text x="76" y="74" font-size="16" fill="#a3a3a3">Helix proposes small, ordered steps from the old app. An engineer approves them.</text>

  <text x="76" y="124" font-size="14" font-weight="600" letter-spacing="1.2" fill="#737373">FOR EVERY CHECKPOINT</text>

  <!-- 2 -->
  <text x="76" y="162" font-size="19" font-weight="600" fill="#f0f0f0">An agent builds the step</text>
  <text x="76" y="190" font-size="16" fill="#a3a3a3">In Swift and Kotlin, using the old React Native app as the reference.</text>

  <!-- 3 -->
  <text x="76" y="242" font-size="19" font-weight="600" fill="#f0f0f0">It passes three gates</text>
  <use href="#i-test" x="76" y="258" width="20" height="20" color="#8a8a8a"/>
  <use href="#i-compare" x="76" y="290" width="20" height="20" color="#8a8a8a"/>
  <use href="#i-robot" x="76" y="322" width="20" height="20" color="#8a8a8a"/>
  <g font-size="16" fill="#a3a3a3">
    <text x="106" y="274">Tests generated from the old app</text>
    <text x="106" y="306">A visual match against the old app</text>
    <text x="106" y="338">Two AI reviewers, and both must approve</text>
  </g>

  <!-- 4 -->
  <text x="76" y="386" font-size="19" font-weight="600" fill="#22d3ee">An engineer approves</text>
  <text x="76" y="414" font-size="16" fill="#a3a3a3">Then the step is committed and the next checkpoint starts.</text>

  <!-- results -->
  <line x1="24" y1="460" x2="736" y2="460" stroke="#2e2e2e" stroke-width="1.5"/>
  <text x="24" y="496" font-size="14" font-weight="600" letter-spacing="1.2" fill="#737373">RESULT ON ANDROID · 6 ENGINEERS, 12 WEEKS</text>
  <g font-size="34" font-weight="600" fill="#f0f0f0">
    <text x="24" y="550">2×</text>
    <text x="268" y="550">−109 MB</text>
    <text x="512" y="550">10×</text>
  </g>
  <g font-size="16" fill="#a3a3a3">
    <text x="24" y="578">faster app startup</text>
    <text x="268" y="578">smaller app</text>
    <text x="512" y="578">fewer crashing sessions</text>
  </g>
</svg>
