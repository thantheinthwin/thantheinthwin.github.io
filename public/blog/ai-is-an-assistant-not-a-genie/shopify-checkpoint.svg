  <rect width="760" height="746" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="759" height="745" fill="none" stroke="#242424"/>

  <!-- 1 plan -->
  <rect x="16" y="16" width="728" height="86" rx="12" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="15" fill="#818cf8"/>
  <text x="44" y="49" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">1</text>
  <text x="70" y="50" font-size="19" font-weight="700" fill="#f0f0f0">Plan the checkpoints</text>
  <text x="70" y="80" font-size="15" font-style="italic" fill="#9a9a9a">Helix proposes small, ordered steps from the old app; an engineer approves them</text>
  <use href="#i-list" x="700" y="30" width="28" height="28" color="#818cf8"/>

  <line x1="380" y1="103" x2="380" y2="124" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- repeated loop -->
  <rect x="16" y="128" width="728" height="426" rx="14" fill="none" stroke="#9a9a9a" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 6"/>
  <use href="#i-loop" x="30" y="139" width="22" height="22" color="#9a9a9a"/>
  <text x="60" y="156" font-size="16" font-weight="700" fill="#9a9a9a">Repeated for every checkpoint</text>

  <!-- 2 agent builds -->
  <rect x="30" y="172" width="700" height="70" rx="10" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <circle cx="58" cy="207" r="15" fill="#c4c4c4"/>
  <text x="58" y="212" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">2</text>
  <text x="84" y="202" font-size="18" font-weight="700" fill="#f0f0f0">Agent builds one checkpoint</text>
  <text x="84" y="226" font-size="15" font-style="italic" fill="#9a9a9a">in Swift and Kotlin, using the old React Native app as the reference</text>
  <use href="#i-robot" x="686" y="193" width="28" height="28" color="#c4c4c4"/>

  <line x1="380" y1="243" x2="380" y2="264" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3 gates -->
  <rect x="30" y="268" width="700" height="176" rx="10" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <circle cx="58" cy="296" r="15" fill="#d6a35c"/>
  <text x="58" y="301" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">3</text>
  <text x="84" y="302" font-size="18" font-weight="700" fill="#f0f0f0">Quality gates</text>
  <text x="210" y="302" font-size="15" font-style="italic" fill="#9a9a9a">every gate has to pass</text>

  <g fill="#161616" stroke="#d6a35c" stroke-opacity="0.7" stroke-width="1.5">
    <rect x="44" y="322" width="214" height="108" rx="8"/>
    <rect x="273" y="322" width="214" height="108" rx="8"/>
    <rect x="502" y="322" width="214" height="108" rx="8"/>
  </g>
  <use href="#i-test" x="137" y="334" width="28" height="28" color="#d6a35c"/>
  <use href="#i-compare" x="366" y="334" width="28" height="28" color="#d6a35c"/>
  <use href="#i-robot" x="595" y="334" width="28" height="28" color="#d6a35c"/>
  <g text-anchor="middle">
    <text x="151" y="388" font-size="16" font-weight="700" fill="#f0f0f0">Tests</text>
    <text x="380" y="388" font-size="16" font-weight="700" fill="#f0f0f0">Visual match</text>
    <text x="609" y="388" font-size="16" font-weight="700" fill="#f0f0f0">2 AI reviewers</text>
    <text x="151" y="412" font-size="14" fill="#9a9a9a">generated from the old app</text>
    <text x="380" y="412" font-size="14" fill="#9a9a9a">against the old app</text>
    <text x="609" y="412" font-size="14" fill="#9a9a9a">both must approve</text>
  </g>

  <line x1="380" y1="445" x2="380" y2="466" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4 engineer -->
  <rect x="30" y="470" width="700" height="70" rx="10" fill="#111111" stroke="#4ade80" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="58" cy="505" r="15" fill="#4ade80"/>
  <text x="58" y="510" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">4</text>
  <text x="84" y="500" font-size="18" font-weight="700" fill="#f0f0f0">Engineer approves</text>
  <text x="84" y="524" font-size="15" font-style="italic" fill="#9a9a9a">then the step is committed and the next checkpoint starts</text>
  <use href="#i-check" x="686" y="491" width="28" height="28" color="#4ade80"/>

  <line x1="380" y1="555" x2="380" y2="576" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5 results -->
  <rect x="16" y="580" width="728" height="150" rx="12" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <circle cx="44" cy="608" r="15" fill="#22d3ee"/>
  <text x="44" y="613" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">5</text>
  <text x="70" y="614" font-size="19" font-weight="700" fill="#f0f0f0">Result on Android</text>
  <text x="728" y="614" font-size="15" fill="#9a9a9a" text-anchor="end">6 engineers · 12 weeks</text>

  <g fill="#161616" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5">
    <rect x="30" y="630" width="224" height="86" rx="8"/>
    <rect x="268" y="630" width="224" height="86" rx="8"/>
    <rect x="506" y="630" width="224" height="86" rx="8"/>
  </g>
  <use href="#i-clock" x="44" y="657" width="32" height="32" color="#22d3ee"/>
  <use href="#i-box" x="282" y="657" width="32" height="32" color="#22d3ee"/>
  <use href="#i-shield" x="520" y="657" width="32" height="32" color="#22d3ee"/>
  <g font-size="24" font-weight="700" fill="#f0f0f0">
    <text x="90" y="670">2× faster</text>
    <text x="328" y="670">−109 MB</text>
    <text x="566" y="670">10× fewer</text>
  </g>
  <g font-size="14" fill="#9a9a9a">
    <text x="90" y="696">app startup</text>
    <text x="328" y="696">app size</text>
    <text x="566" y="696">crashing sessions</text>
  </g>
