<svg viewBox="0 0 720 380" width="720" height="380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="719" height="379" fill="none" stroke="#242424"/>

  <text x="20" y="36" font-size="18" fill="#e8e8e8">One checkpoint, repeated every step</text>
  <text x="700" y="36" font-size="16" fill="#9a9a9a" text-anchor="end">6 engineers · 12 weeks</text>

  <!-- row 1 -->
  <rect x="20" y="60" width="200" height="100" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <rect x="260" y="60" width="200" height="100" rx="10" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
  <rect x="500" y="60" width="200" height="100" rx="10" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
  <!-- row 2 -->
  <rect x="20" y="225" width="200" height="100" rx="10" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
  <rect x="260" y="225" width="200" height="100" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="500" y="225" width="200" height="100" rx="10" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 5"/>

  <g text-anchor="middle" font-size="20" font-weight="700">
    <text x="120" y="104" fill="#e8e8e8">Agent builds</text>
    <text x="360" y="104" fill="#d6a35c">Tests</text>
    <text x="600" y="104" fill="#d6a35c">Visual match</text>
    <text x="120" y="269" fill="#d6a35c">2 AI reviewers</text>
    <text x="360" y="269" fill="#4ade80">Engineer</text>
    <text x="600" y="269" fill="#e8e8e8">Commit,</text>
  </g>
  <g text-anchor="middle" font-size="17" fill="#9a9a9a">
    <text x="120" y="132">one checkpoint</text>
    <text x="360" y="132">from the old app</text>
    <text x="600" y="132">vs. the old app</text>
    <text x="120" y="297">both must approve</text>
    <text x="360" y="297">approves</text>
    <text x="600" y="297">next checkpoint</text>
  </g>

  <g stroke="#8a8a8a" stroke-width="2.5" fill="none">
    <line x1="220" y1="110" x2="256" y2="110" marker-end="url(#arrow)"/>
    <line x1="460" y1="110" x2="496" y2="110" marker-end="url(#arrow)"/>
    <polyline points="600,160 600,192 120,192 120,221" marker-end="url(#arrow)"/>
    <line x1="220" y1="275" x2="256" y2="275" marker-end="url(#arrow)"/>
    <line x1="460" y1="275" x2="496" y2="275" marker-end="url(#arrow)"/>
  </g>

  <rect x="20" y="347" width="14" height="14" rx="3" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
  <text x="44" y="359" font-size="16" fill="#9a9a9a">quality gate</text>
  <rect x="200" y="347" width="14" height="14" rx="3" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <text x="224" y="359" font-size="16" fill="#9a9a9a">human sign-off</text>
</svg>
