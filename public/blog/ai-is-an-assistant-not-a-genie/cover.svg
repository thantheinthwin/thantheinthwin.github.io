<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#242424" stroke-width="1"/>

  <text x="80" y="150" font-size="64" font-weight="700" fill="#f2f2f2">AI Is an Assistant,</text>
  <text x="80" y="225" font-size="64" font-weight="700" fill="#22d3ee">Not a Genie</text>

  <!-- human-in-the-loop flow -->
  <g transform="translate(80,360)" text-anchor="middle" font-size="22" font-weight="700">
    <rect x="0" y="0" width="190" height="80" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="95" y="48" fill="#22d3ee">scope</text>

    <rect x="250" y="0" width="190" height="80" rx="10" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
    <text x="345" y="48" fill="#e8e8e8">AI builds</text>

    <rect x="500" y="0" width="190" height="80" rx="10" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="595" y="48" fill="#22d3ee">review</text>

    <rect x="750" y="0" width="190" height="80" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="845" y="48" fill="#4ade80">ship</text>
  </g>
  <g stroke="#8a8a8a" stroke-width="2.5">
    <line x1="270" y1="400" x2="326" y2="400" marker-end="url(#arrow)"/>
    <line x1="520" y1="400" x2="576" y2="400" marker-end="url(#arrow)"/>
    <line x1="770" y1="400" x2="826" y2="400" marker-end="url(#arrow)"/>
  </g>
  <polyline points="675,440 675,500 175,500 175,444" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="425" y="530" font-size="18" fill="#9a9a9a" text-anchor="middle">human in the loop</text>
</svg>
