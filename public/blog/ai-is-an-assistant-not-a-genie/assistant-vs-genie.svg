<svg viewBox="16 0 728 500" width="728" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Icons: Phosphor Icons (https://phosphoricons.com), MIT License, Copyright (c) 2023 Phosphor Icons -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c5c"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <symbol id="i-person" viewBox="0 0 256 256"><g fill="currentColor"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></g></symbol>
    <symbol id="i-wand" viewBox="0 0 256 256"><g fill="currentColor"><path d="M48,64a8,8,0,0,1,8-8H72V40a8,8,0,0,1,16,0V56h16a8,8,0,0,1,0,16H88V88a8,8,0,0,1-16,0V72H56A8,8,0,0,1,48,64ZM184,192h-8v-8a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0v-8h8a8,8,0,0,0,0-16Zm56-48H224V128a8,8,0,0,0-16,0v16H192a8,8,0,0,0,0,16h16v16a8,8,0,0,0,16,0V160h16a8,8,0,0,0,0-16ZM219.31,80,80,219.31a16,16,0,0,1-22.62,0L36.68,198.63a16,16,0,0,1,0-22.63L176,36.69a16,16,0,0,1,22.63,0l20.68,20.68A16,16,0,0,1,219.31,80Zm-54.63,32L144,91.31l-96,96L68.68,208ZM208,68.69,187.31,48l-32,32L176,100.69Z"/></g></symbol>
  </defs>

  <!-- assistant -->
  <use href="#i-person" x="24" y="30" width="24" height="24" color="#8a8a8a"/>
  <text x="58" y="50" font-size="22" font-weight="600" fill="#f0f0f0">Assistant</text>
  <text x="24" y="80" font-size="16" fill="#a3a3a3">A human decides at every step.</text>

  <g font-size="18" font-weight="600">
    <text x="24" y="140" fill="#22d3ee">You scope</text>
    <text x="172" y="140" fill="#f0f0f0">AI builds</text>
    <text x="320" y="140" fill="#22d3ee">You review</text>
    <text x="490" y="140" fill="#f0f0f0">Ship</text>
    <text x="616" y="140" fill="#fb7185">It breaks</text>
  </g>
  <g stroke="#5c5c5c" stroke-width="1.5">
    <line x1="128" y1="134" x2="160" y2="134" marker-end="url(#arrow)"/>
    <line x1="264" y1="134" x2="308" y2="134" marker-end="url(#arrow)"/>
    <line x1="424" y1="134" x2="478" y2="134" marker-end="url(#arrow)"/>
    <line x1="540" y1="134" x2="604" y2="134" marker-end="url(#arrow)"/>
  </g>
  <polyline points="660,152 660,176 512,176 512,156" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="586" y="206" font-size="16" fill="#22d3ee" text-anchor="middle">AI drafts a fix, you verify it</text>

  <line x1="24" y1="248" x2="736" y2="248" stroke="#2e2e2e" stroke-width="1.5"/>

  <!-- genie -->
  <use href="#i-wand" x="24" y="284" width="24" height="24" color="#8a8a8a"/>
  <text x="58" y="304" font-size="22" font-weight="600" fill="#f0f0f0">Genie</text>
  <text x="24" y="334" font-size="16" fill="#a3a3a3">Nobody in the loop can check the work.</text>

  <g font-size="18" font-weight="600">
    <text x="24" y="394" fill="#f0f0f0">Prompt it</text>
    <text x="172" y="394" fill="#f0f0f0">AI builds</text>
    <text x="320" y="394" fill="#5c5c5c" font-weight="400" text-decoration="line-through">no review</text>
    <text x="490" y="394" fill="#f0f0f0">Ship</text>
    <text x="616" y="394" fill="#fb7185">It breaks</text>
  </g>
  <g stroke="#5c5c5c" stroke-width="1.5">
    <line x1="116" y1="388" x2="160" y2="388" marker-end="url(#arrow)"/>
    <line x1="264" y1="388" x2="308" y2="388" marker-end="url(#arrow)"/>
    <line x1="410" y1="388" x2="478" y2="388" marker-end="url(#arrow)"/>
    <line x1="540" y1="388" x2="604" y2="388" marker-end="url(#arrow)"/>
  </g>
  <polyline points="660,406 660,430 512,430 512,410" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="586" y="460" font-size="16" fill="#fb7185" text-anchor="middle">AI fixes it, nobody can check</text>
</svg>
