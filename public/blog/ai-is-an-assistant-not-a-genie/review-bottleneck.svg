<svg viewBox="0 0 1040 470" width="1040" height="470" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1040" height="470" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1039" height="469" fill="none" stroke="#242424"/>

  <!-- one giant PR -->
  <text x="20" y="40" font-size="22" font-weight="700" fill="#fb7185">One giant PR</text>
  <text x="20" y="64" font-size="16" fill="#9a9a9a">too big to hold in your head</text>

  <rect x="20" y="85" width="420" height="150" rx="8" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <g stroke="#3a3a3a" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="105" x2="300" y2="105"/>
    <line x1="60" y1="119" x2="380" y2="119"/>
    <line x1="60" y1="133" x2="250" y2="133"/>
    <line x1="80" y1="147" x2="410" y2="147"/>
    <line x1="80" y1="161" x2="330" y2="161"/>
    <line x1="60" y1="175" x2="360" y2="175"/>
    <line x1="40" y1="189" x2="220" y2="189"/>
    <line x1="60" y1="203" x2="400" y2="203"/>
    <line x1="60" y1="217" x2="290" y2="217"/>
  </g>

  <line x1="440" y1="160" x2="574" y2="160" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="507" y="148" font-size="15" fill="#9a9a9a" text-anchor="middle">one review</text>

  <!-- reviewer -->
  <circle cx="620" cy="138" r="18" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
  <path d="M590,192 a30,30 0 0 1 60,0" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>

  <text x="680" y="150" font-size="18" fill="#e8e8e8">skimmed, approved,</text>
  <text x="680" y="176" font-size="18" fill="#fb7185">understood by no one</text>

  <line x1="20" y1="262" x2="1020" y2="262" stroke="#242424" stroke-width="1.5"/>

  <!-- small checkpoints -->
  <text x="20" y="300" font-size="22" font-weight="700" fill="#4ade80">Small checkpoints</text>
  <text x="20" y="324" font-size="16" fill="#9a9a9a">each one fits in your head</text>

  <g fill="none" stroke="#9a9a9a" stroke-width="2">
    <rect x="20" y="345" width="150" height="70" rx="8"/>
    <rect x="225" y="345" width="150" height="70" rx="8"/>
    <rect x="430" y="345" width="150" height="70" rx="8"/>
    <rect x="635" y="345" width="150" height="70" rx="8"/>
    <rect x="840" y="345" width="150" height="70" rx="8"/>
  </g>
  <g stroke="#3a3a3a" stroke-width="6" stroke-linecap="round">
    <line x1="36" y1="365" x2="130" y2="365"/><line x1="50" y1="380" x2="150" y2="380"/><line x1="50" y1="395" x2="110" y2="395"/>
    <line x1="241" y1="365" x2="320" y2="365"/><line x1="255" y1="380" x2="355" y2="380"/><line x1="255" y1="395" x2="300" y2="395"/>
    <line x1="446" y1="365" x2="540" y2="365"/><line x1="460" y1="380" x2="520" y2="380"/><line x1="460" y1="395" x2="560" y2="395"/>
    <line x1="651" y1="365" x2="730" y2="365"/><line x1="665" y1="380" x2="765" y2="380"/><line x1="665" y1="395" x2="720" y2="395"/>
    <line x1="856" y1="365" x2="950" y2="365"/><line x1="870" y1="380" x2="930" y2="380"/><line x1="870" y1="395" x2="970" y2="395"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="2.5">
    <line x1="170" y1="380" x2="221" y2="380" marker-end="url(#arrow)"/>
    <line x1="375" y1="380" x2="426" y2="380" marker-end="url(#arrow)"/>
    <line x1="580" y1="380" x2="631" y2="380" marker-end="url(#arrow)"/>
    <line x1="785" y1="380" x2="836" y2="380" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="95" cy="440" r="13"/><path d="M89,440 l4,4 l8,-8"/>
    <circle cx="300" cy="440" r="13"/><path d="M294,440 l4,4 l8,-8"/>
    <circle cx="505" cy="440" r="13"/><path d="M499,440 l4,4 l8,-8"/>
    <circle cx="710" cy="440" r="13"/><path d="M704,440 l4,4 l8,-8"/>
    <circle cx="915" cy="440" r="13"/><path d="M909,440 l4,4 l8,-8"/>
  </g>
</svg>
