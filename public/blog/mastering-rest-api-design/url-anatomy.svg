<svg viewBox="0 0 620 190" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- URL line: each segment is pinned with textLength so the boxes always align -->
  <text x="20" y="44" font-size="21" fill="#c084fc" font-weight="bold" textLength="48" lengthAdjust="spacingAndGlyphs">GET:</text>
  <text x="80" y="44" font-size="21" fill="#e8e8e8" textLength="94" lengthAdjust="spacingAndGlyphs">https://</text>
  <text x="176" y="44" font-size="21" fill="#e8e8e8" textLength="130" lengthAdjust="spacingAndGlyphs">example.com</text>
  <text x="308" y="44" font-size="21" fill="#e8e8e8" textLength="140" lengthAdjust="spacingAndGlyphs">/foo-service</text>
  <text x="450" y="44" font-size="21" fill="#e8e8e8" textLength="36" lengthAdjust="spacingAndGlyphs">/v1</text>
  <text x="488" y="44" font-size="21" fill="#e8e8e8" textLength="48" lengthAdjust="spacingAndGlyphs">/bar</text>
  <text x="538" y="44" font-size="21" fill="#e8e8e8" textLength="60" lengthAdjust="spacingAndGlyphs">/{id}</text>

  <!-- segment boxes -->
  <rect x="77"  y="16" width="100" height="38" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="173" y="16" width="136" height="38" rx="10" fill="none" stroke="#fb923c" stroke-width="2.5"/>
  <rect x="305" y="16" width="146" height="38" rx="10" fill="none" stroke="#818cf8" stroke-width="2.5"/>
  <rect x="447" y="16" width="42"  height="38" rx="10" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <rect x="485" y="16" width="54"  height="38" rx="10" fill="none" stroke="#d6a35c" stroke-width="2.5"/>
  <rect x="535" y="16" width="66"  height="38" rx="10" fill="none" stroke="#fb7185" stroke-width="2.5"/>

  <!-- Method -->
  <polygon points="44,52 39,62 49,62" fill="#c084fc"/>
  <line x1="44" y1="60" x2="44" y2="86" stroke="#c084fc" stroke-width="2.5"/>
  <text x="44" y="106" font-size="15" fill="#c084fc" text-anchor="middle" font-weight="bold">Method</text>

  <!-- Protocol -->
  <polygon points="127,58 122,68 132,68" fill="#4ade80"/>
  <line x1="127" y1="66" x2="127" y2="146" stroke="#4ade80" stroke-width="2.5"/>
  <text x="127" y="166" font-size="15" fill="#4ade80" text-anchor="middle" font-weight="bold">Protocol</text>

  <!-- Domain -->
  <polygon points="241,58 236,68 246,68" fill="#fb923c"/>
  <line x1="241" y1="66" x2="241" y2="90" stroke="#fb923c" stroke-width="2.5"/>
  <text x="241" y="110" font-size="15" fill="#fb923c" text-anchor="middle" font-weight="bold">Domain</text>

  <!-- service -->
  <polygon points="378,58 373,68 383,68" fill="#818cf8"/>
  <line x1="378" y1="66" x2="378" y2="146" stroke="#818cf8" stroke-width="2.5"/>
  <text x="378" y="166" font-size="15" fill="#818cf8" text-anchor="middle" font-weight="bold">service</text>

  <!-- version -->
  <polygon points="468,58 463,68 473,68" fill="#f87171"/>
  <line x1="468" y1="66" x2="468" y2="90" stroke="#f87171" stroke-width="2.5"/>
  <text x="468" y="110" font-size="15" fill="#f87171" text-anchor="middle" font-weight="bold">version</text>

  <!-- resource -->
  <polygon points="512,58 507,68 517,68" fill="#d6a35c"/>
  <line x1="512" y1="66" x2="512" y2="146" stroke="#d6a35c" stroke-width="2.5"/>
  <text x="512" y="166" font-size="15" fill="#d6a35c" text-anchor="middle" font-weight="bold">resource</text>

  <!-- parameters -->
  <polygon points="568,58 563,68 573,68" fill="#fb7185"/>
  <line x1="568" y1="66" x2="568" y2="90" stroke="#fb7185" stroke-width="2.5"/>
  <text x="568" y="110" font-size="15" fill="#fb7185" text-anchor="middle" font-weight="bold">parameters</text>
</svg>
