<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#242424" stroke-width="1"/>

  <text x="80" y="140" font-size="44" font-weight="700" fill="#f2f2f2">I Broke My React Query Cache</text>
  <text x="80" y="200" font-size="44" font-weight="700" fill="#fb7185">by Using &lt;a&gt; in Next.js</text>

  <g transform="translate(80,320)" font-size="26" font-weight="700">
    <rect x="0" y="0" width="190" height="64" rx="10" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="95" y="42" fill="#fb7185" text-anchor="middle">&lt;a&gt;</text>
    <line x1="30" y1="12" x2="160" y2="52" stroke="#fb7185" stroke-width="3"/>
    <text x="0" y="104" font-size="16" fill="#9a9a9a">full reload — state lost</text>

    <rect x="320" y="0" width="260" height="64" rx="10" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="450" y="42" fill="#4ade80" text-anchor="middle">next/link</text>
    <text x="320" y="104" font-size="16" fill="#9a9a9a">client nav — state kept</text>
  </g>
</svg>
