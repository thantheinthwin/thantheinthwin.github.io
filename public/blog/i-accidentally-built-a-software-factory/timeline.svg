<svg viewBox="0 0 728 460" width="728" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#26262b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#63636b"/>
    </marker>
  </defs>
  <rect width="728" height="460" rx="14" fill="#0e0e10"/>
  <rect width="728" height="460" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="727" height="459" rx="14" fill="none" stroke="#202024"/>
  <rect x="16" y="16" width="696" height="318" rx="12" fill="#818cf8" fill-opacity="0.07" stroke="#818cf8" stroke-opacity="0.4"/>
  <rect x="16" y="350" width="696" height="94" rx="12" fill="#e0a85a" fill-opacity="0.07" stroke="#e0a85a" stroke-opacity="0.4"/>
  <text x="32" y="40" font-size="15" font-weight="600" fill="#a5b4fc">People on the line</text>
  <text x="696" y="40" font-size="13" fill="#8b8b94" text-anchor="end">standard steps, reusable parts, quality checks</text>
  <text x="32" y="374" font-size="15" font-weight="600" fill="#f2c27b">Agents on the line</text>
  <text x="696" y="374" font-size="13" fill="#8b8b94" text-anchor="end">same idea, new workers</text>
  <line x1="132" y1="74" x2="132" y2="298" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="152" y="50" width="544" height="48" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <circle cx="132" cy="74" r="5" fill="#0e0e10" stroke="#818cf8" stroke-width="2"/>
  <text x="116" y="80" font-size="17" font-weight="600" fill="#f4f4f5" text-anchor="end">1968</text>
  <text x="168" y="71" font-size="14.5" font-weight="600" fill="#f4f4f5">Bob Bemer proposes a “software factory”</text>
  <text x="168" y="89" font-size="13" fill="#8b8b94">standard tools and a shared database for GE’s programmers</text>
  <rect x="152" y="106" width="544" height="48" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <circle cx="132" cy="130" r="5" fill="#0e0e10" stroke="#818cf8" stroke-width="2"/>
  <text x="116" y="136" font-size="17" font-weight="600" fill="#f4f4f5" text-anchor="end">1969</text>
  <text x="168" y="127" font-size="14.5" font-weight="600" fill="#f4f4f5">Hitachi opens the first one</text>
  <text x="168" y="145" font-size="13" fill="#8b8b94">process standards to make software reliable</text>
  <rect x="152" y="162" width="544" height="48" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <circle cx="132" cy="186" r="5" fill="#0e0e10" stroke="#818cf8" stroke-width="2"/>
  <text x="116" y="192" font-size="17" font-weight="600" fill="#f4f4f5" text-anchor="end">1970s</text>
  <text x="168" y="183" font-size="14.5" font-weight="600" fill="#f4f4f5">Toshiba, NEC, Fujitsu and SDC follow</text>
  <text x="168" y="201" font-size="13" fill="#8b8b94">reusable parts, quality checks, measurement</text>
  <rect x="152" y="218" width="544" height="48" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <circle cx="132" cy="242" r="5" fill="#0e0e10" stroke="#818cf8" stroke-width="2"/>
  <text x="116" y="248" font-size="17" font-weight="600" fill="#f4f4f5" text-anchor="end">1991</text>
  <text x="168" y="239" font-size="14.5" font-weight="600" fill="#f4f4f5">Cusumano writes Japan’s Software Factories</text>
  <text x="168" y="257" font-size="13" fill="#8b8b94">a study of how those factories worked</text>
  <rect x="152" y="274" width="544" height="48" rx="9" fill="#17171b" stroke="#2e2e34" stroke-width="1.2"/>
  <circle cx="132" cy="298" r="5" fill="#0e0e10" stroke="#818cf8" stroke-width="2"/>
  <text x="116" y="304" font-size="17" font-weight="600" fill="#f4f4f5" text-anchor="end">2004</text>
  <text x="168" y="295" font-size="14.5" font-weight="600" fill="#f4f4f5">Microsoft publishes Software Factories</text>
  <text x="168" y="313" font-size="13" fill="#8b8b94">patterns, models and tools to assemble apps</text>
  <rect x="152" y="384" width="544" height="48" rx="9" fill="#17171b" stroke="#e0a85a" stroke-width="1.5"/>
  <circle cx="132" cy="408" r="5" fill="#0e0e10" stroke="#e0a85a" stroke-width="2"/>
  <text x="116" y="414" font-size="17" font-weight="600" fill="#f2c27b" text-anchor="end">2026</text>
  <text x="168" y="405" font-size="14.5" font-weight="600" fill="#f4f4f5">Agent “software factories”</text>
  <text x="168" y="423" font-size="13" fill="#8b8b94">agents build, people set the goal and approve</text>
</svg>
